name: Scheduled Maintenance Cron

on:
  schedule:
    # Runs daily at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  # Allows manual 1-click execution from GitHub Actions tab
  workflow_dispatch:

jobs:
  maintenance:
    name: Execute Production Cron Jobs
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Expired Seller Purge
        run: |
          echo "Triggering 15-day seller purge..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://zebalpha-backend.onrender.com/api/v1/cron/seller/purge-expired" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Seller Purge response HTTP code: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Failed with HTTP $STATUS"
            exit 1
          fi

      - name: Trigger Order Auto-Completion
        run: |
          echo "Triggering delivered orders auto-completion..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://zebalpha-backend.onrender.com/api/v1/cron/customer/auto-complete-orders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Order Auto-Completion response HTTP code: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Failed with HTTP $STATUS"
            exit 1
          fi
