services:
  # 1. Main Customer Storefront (Next.js)
  - type: web
    name: asaliswad-storefront
    runtime: node
    plan: free
    region: singapore
    rootDir: user-frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.x

  # 2. Admin Panel (Next.js)
  - type: web
    name: asaliswad-admin-panel
    runtime: node
    plan: free
    region: singapore
    rootDir: admin-panel
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.x
