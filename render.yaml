services:
  # 1. Main Customer Storefront (Next.js)
  - type: web
    name: asaliswad-storefront
    runtime: node
    plan: free
    region: singapore
    rootDir: asaliswad-customer
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.x

  # 2. Seller Panel (Next.js)
  - type: web
    name: asaliswad-seller-panel
    runtime: node
    plan: free
    region: singapore
    rootDir: asaliswad-seller
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.x

  # 3. Super Admin Panel (Next.js)
  - type: web
    name: asaliswad-admin-panel
    runtime: node
    plan: free
    region: singapore
    rootDir: asaliswad-superadmin
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.x

  # 4. Express Backend API
  - type: web
    name: asaliswad-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: asaliswad-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.x

  # 5. Daily Seller Purge Cron Job
  - type: cron
    name: asaliswad-daily-purge-cron
    runtime: node
    plan: free
    region: singapore
    schedule: "0 0 * * *"
    rootDir: asaliswad-backend
    buildCommand: npm install
    startCommand: node -e "fetch('https://api.asaliswad.com/api/v1/cron/seller/purge-expired', { method: 'POST' }).then(r=>r.json()).then(console.log)"
