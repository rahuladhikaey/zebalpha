services:
  # 1. Main Customer Storefront (Next.js)
  - type: web
    name: zebalpha-storefront
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    rootDir: zebalpha-customer
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://zebalpha-backend-hlk5.onrender.com
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://zebalpha-backend-hlk5.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # 2. Seller Merchant Portal (Next.js)
  - type: web
    name: zebalpha-seller-panel
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    rootDir: zebalpha-seller
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://zebalpha-backend-hlk5.onrender.com
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://zebalpha-backend-hlk5.onrender.com
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: noreply@asaliswad.com
      - key: BREVO_SENDER_NAME
        value: ZEBALPHA

  # 3. Super Admin Management Portal (Next.js)
  - type: web
    name: zebalpha-admin-panel
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    rootDir: zebalpha-superadmin
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: ADMIN_ACCESS_KEY_1
        sync: false
      - key: ADMIN_ACCESS_KEY_2
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://zebalpha-backend-hlk5.onrender.com
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://zebalpha-backend-hlk5.onrender.com

  # 4. Central Express API Gateway
  - type: web
    name: zebalpha-backend
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    rootDir: zebalpha-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        value: https://zebalpha-backend-hlk5.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: DB_HOST
        value: aws-0-ap-south-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_A_URL
        sync: false
      - key: SUPABASE_A_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_A_ANON_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: noreply@asaliswad.com
      - key: BREVO_SENDER_NAME
        value: ZEBALPHA

