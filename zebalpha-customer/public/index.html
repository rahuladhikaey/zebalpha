<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZEBALPHA</title>
  <link rel="icon" href="official-logo.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      animation: fadeIn 0.8s ease-out;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .loader {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-top: 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="official-logo.png" alt="ZEBALPHA Logo" class="logo" />
    <h1 class="title">ZEBALPHA</h1>
    <div class="loader"></div>
  </div>
  <script>
    // Auto-redirect splash screen to live Zebalpha customer web app
    setTimeout(function() {
      window.location.href = "https://zebalpha-storefront-1lxz.onrender.com";
    }, 1500);
  </script>
</body>
</html>
