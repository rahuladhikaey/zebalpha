<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050507" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="avatarStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Background -->
  <circle cx="100" cy="100" r="98" fill="#09090b" stroke="url(#avatarStroke)" stroke-width="3" />
  <circle cx="100" cy="100" r="90" fill="url(#avatarGlow)" />
  
  <!-- Subtle Internal Tech Dashes -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="100" cy="100" r="54" fill="#050507" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Sleek Question Mark (?) -->
  <text x="100" y="122" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900">?</text>
</svg>
