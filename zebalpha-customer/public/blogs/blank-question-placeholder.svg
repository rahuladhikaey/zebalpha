<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#022c22" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#050507" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="emeraldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.98" />
    </linearGradient>
    <!-- Subtle Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#10b981" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Deep Base Background -->
  <rect width="1200" height="675" fill="#060608" />
  <rect width="1200" height="675" fill="url(#bgGlow)" />
  <rect width="1200" height="675" fill="url(#techGrid)" />

  <!-- Outer Framing Vignette & Borders -->
  <rect x="24" y="24" width="1152" height="627" rx="36" fill="none" stroke="#27272a" stroke-width="1.5" stroke-opacity="0.6" />
  <rect x="40" y="40" width="1120" height="595" rx="24" fill="none" stroke="#3f3f46" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.25" />

  <!-- Top Badges / Metadata Header -->
  <g transform="translate(70, 72)">
    <rect width="180" height="34" rx="17" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#10b981" />
    <text x="34" y="22" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="2">FOUNDER STORY</text>
    
    <text x="210" y="22" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">ZEBALPHA EDITORIAL ARCHIVE • 2026</text>
  </g>

  <!-- Center Aura -->
  <circle cx="600" cy="310" r="160" fill="url(#badgeGlow)" />

  <!-- Central Glassmorphism Placeholder Card -->
  <g transform="translate(480, 190)">
    <!-- Shadow & Glow -->
    <rect x="-10" y="-10" width="260" height="260" rx="42" fill="#000000" fill-opacity="0.4" />
    <rect width="240" height="240" rx="36" fill="url(#cardGrad)" stroke="url(#emeraldStroke)" stroke-width="2" />
    
    <!-- Inner Concentric Tech Rings -->
    <circle cx="120" cy="120" r="88" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="120" cy="120" r="64" fill="#09090b" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Stylized Modern Question Mark (?) -->
    <text x="120" y="146" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="88" font-weight="900">?</text>
  </g>

  <!-- Core Headline Text -->
  <text x="600" y="495" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">
    ZEBALPHA: HOW TWO COLLEGE FRIENDS ARE REIMAGINING
  </text>
  <text x="600" y="530" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.2">
    INDIAN E-COMMERCE FOR CUSTOMERS &amp; SMALL BUSINESSES
  </text>

  <!-- Bottom Subtext / Status Marker -->
  <g transform="translate(600, 580)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">
      VISUAL PREVIEW • OFFICIAL PHOTOGRAPHY IN CURATION
    </text>
  </g>

  <!-- Corner Tech Accent Marks -->
  <path d="M 50 65 L 50 50 L 65 50" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 1150 65 L 1150 50 L 1135 50" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 50 610 L 50 625 L 65 625" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 1150 610 L 1150 625 L 1135 625" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
