<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>No connection - ZebAlpha</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Main Center Container */
    .center-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .illustration-box {
      width: 170px;
      height: 170px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .illustration-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    h1 {
      font-size: 21px;
      font-weight: 700;
      color: #202124;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }

    p {
      font-size: 14px;
      line-height: 1.45;
      color: #5f6368;
      max-width: 280px;
      margin-bottom: 24px;
    }

    /* Retry Button */
    .retry-btn {
      width: 120px;
      height: 40px;
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: none;
      outline: none;
    }

    .retry-btn:active {
      background-color: #1557b0;
      transform: scale(0.98);
    }

    .retry-btn:disabled {
      background-color: #1a73e8;
      opacity: 0.85;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: #323232;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Bottom Skeleton Navigation Bar */
    .bottom-skeleton-bar {
      width: 100%;
      height: 56px;
      background-color: #ffffff;
      border-top: 1px solid #f1f3f4;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
    }

    .skeleton-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .skeleton-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: #d1d5db;
    }

    .skeleton-pill {
      width: 34px;
      height: 8px;
      border-radius: 4px;
      background-color: #e5e7eb;
    }
  </style>
</head>
<body>

  <div class="center-container">
    <div class="illustration-box">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- 1. Soft Circular Background Disc -->
        <circle cx="100" cy="108" r="50" fill="#F1F3F4" />

        <!-- 2. Geometric Accent Shapes at Base -->
        <polygon points="60,118 76,96 88,118" fill="#EA4335" />
        <polygon points="78,118 94,92 106,118" fill="#FBBC05" />
        <polygon points="112,118 128,94 144,118" fill="#4285F4" />

        <!-- 3. Smartphone Frame -->
        <rect x="74" y="72" width="52" height="70" rx="7" fill="#E5E7EB" />
        <rect x="75" y="73" width="50" height="68" rx="6" fill="#FFFFFF" />
        <line x1="94" y1="78" x2="106" y2="78" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round" />

        <!-- 4. Cellular Signal Strength Bars -->
        <rect x="86" y="111" width="4" height="5" rx="1" fill="#EA4335" />
        <rect x="93" y="105" width="4" height="11" rx="1" fill="#D1D5DB" />
        <rect x="100" y="100" width="4" height="16" rx="1" fill="#D1D5DB" />
        <rect x="107" y="95" width="4" height="21" rx="1" fill="#D1D5DB" />

        <!-- 5. Yellow Cloud -->
        <path d="M84,68 h32 a10,10 0 0,0 2,-19.6 a13.5,13.5 0 0,0 -24.5,-4 a11,11 0 0,0 -14,6.2 a9,9 0 0,0 4.5,17.4 Z" fill="#FBC02D" />

        <!-- 6. Red Lightning Bolt -->
        <polygon points="98,66 93,77 98,77 94,88 104,75 99,75" fill="#EA4335" />

        <!-- 7. Rain Droplets -->
        <line x1="87" y1="71" x2="87" y2="75" stroke="#FBC02D" stroke-width="1.6" stroke-linecap="round" />
        <line x1="91" y1="76" x2="91" y2="80" stroke="#FBC02D" stroke-width="1.6" stroke-linecap="round" />
        <line x1="108" y1="71" x2="108" y2="75" stroke="#FBC02D" stroke-width="1.6" stroke-linecap="round" />
        <line x1="112" y1="76" x2="112" y2="80" stroke="#FBC02D" stroke-width="1.6" stroke-linecap="round" />
      </svg>
    </div>

    <h1>No connection</h1>
    <p>Please check your internet connectivity and try again</p>

    <button id="retryBtn" class="retry-btn">
      <span id="btnText">Retry</span>
      <div id="btnSpinner" class="spinner"></div>
    </button>
  </div>

  <div id="toast" class="toast">Please check your internet connection.</div>

  <!-- Bottom Skeleton Bar -->
  <div class="bottom-skeleton-bar">
    <div class="skeleton-tab">
      <div class="skeleton-circle"></div>
      <div class="skeleton-pill"></div>
    </div>
    <div class="skeleton-tab">
      <div class="skeleton-circle"></div>
      <div class="skeleton-pill"></div>
    </div>
    <div class="skeleton-tab">
      <div class="skeleton-circle"></div>
      <div class="skeleton-pill"></div>
    </div>
    <div class="skeleton-tab">
      <div class="skeleton-circle"></div>
      <div class="skeleton-pill"></div>
    </div>
    <div class="skeleton-tab">
      <div class="skeleton-circle"></div>
      <div class="skeleton-pill"></div>
    </div>
  </div>

  <script>
    const retryBtn = document.getElementById('retryBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const toast = document.getElementById('toast');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function doRetry() {
      btnText.style.display = 'none';
      btnSpinner.style.display = 'block';
      retryBtn.disabled = true;

      setTimeout(() => {
        if (navigator.onLine) {
          window.location.href = 'https://zebalpha.shop/';
        } else {
          btnText.style.display = 'block';
          btnSpinner.style.display = 'none';
          retryBtn.disabled = false;
          showToast('No internet connection. Please try again.');
        }
      }, 700);
    }

    retryBtn.addEventListener('click', doRetry);

    window.addEventListener('online', () => {
      showToast('Connection restored. Loading...');
      setTimeout(() => {
        window.location.href = 'https://zebalpha.shop/';
      }, 500);
    });
  </script>
</body>
</html>
