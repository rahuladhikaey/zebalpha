# Render Blueprint - Customer Storefront
# Service: zebalpha-customer

services:
  - type: web
    name: zebalpha-customer
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://zebalpha-backend-hlk5.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://zebalpha-backend-hlk5.onrender.com
